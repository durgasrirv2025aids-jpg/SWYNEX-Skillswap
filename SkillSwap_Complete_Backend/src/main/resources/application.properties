
# ==========================================
# SkillSwap Backend - Application Settings
# ==========================================

spring.application.name=skillswap-backend

# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=${PORT:8080}


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:skillswap_db}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA & HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==========================================
# JWT AUTHENTICATION CONFIGURATION
# ==========================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# CORS CONFIGURATION
# ==========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://skillswap-sage-nine.vercel.app}


# ==========================================
# CONNECTION POOL CONFIGURATION
# ==========================================

spring.datasource.hikari.maximum-pool-size=5

spring.datasource.hikari.minimum-idle=1

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000
